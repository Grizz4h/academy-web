# HTTP-only bootstrap for Certbot. Same app root + API/uploads as academy.conf.
# After DNS points here, run: certbot --nginx -d rinq-tank.de -d www.rinq-tank.de
# Certbot will add the SSL server block; do not hand-edit academy.conf.

server {
    listen 80;
    listen [::]:80;
    server_name rinq-tank.de www.rinq-tank.de;

    root /opt/academy-web/frontend/dist;
    index index.html;

    # Avatar / account uploads (FastAPI StaticFiles mount)
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
        return 301 /api/;
    }

    # Cache immutable assets
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
