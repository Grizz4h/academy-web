# Shared baseline security headers for rInQ Tank / academy HTTPS vhosts.
# Include inside the SSL `server { ... }` block AND again inside any `location`
# that already uses `add_header` (nginx does not inherit parent add_header then).
#
# Intentionally NO Content-Security-Policy yet (Supabase / Stripe / Google OAuth
# need a careful allowlist — follow-up).
#
# Usage:
#   include /etc/nginx/snippets/academy-security-headers.conf;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), payment=()" always;
